<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CE-25A 飞机俯视图</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    h1 {
      font-size: 16px;
      font-weight: 600;
      color: #333;
      margin-bottom: 16px;
      letter-spacing: 0.5px;
    }
    .container {
      max-width: 1200px;
      width: 95vw;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 24px;
      background: #fafafa;
    }
    object {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <h1>CE-25A 俯视图外轮廓</h1>
  <div class="container">
    <object data="/aircraft-top.svg" type="image/svg+xml"></object>

</html>
