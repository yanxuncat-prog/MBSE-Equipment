name: aeroequip

services:
  db:
    image: postgres:15-alpine
    ports:
      - "15432:5432"
    environment:
      POSTGRES_USER: aeroequip
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devpassword}
      POSTGRES_DB: aeroequip
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data/aeroequip_dump.sql:/docker-entrypoint-initdb.d/01-restore.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aeroequip"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    ports:
      - "3001:8000"
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql+asyncpg://aeroequip:${DB_PASSWORD:-devpassword}@db:5432/aeroequip
      DATABASE_URL_SYNC: postgresql://aeroequip:${DB_PASSWORD:-devpassword}@db:5432/aeroequip
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "3000:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  pgdata:
