name: aeroequip

services:
  backend:
    build:
      context: ./backend
    ports:
      - "3001:8000"
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql+asyncpg://aeroequip:${DB_PASSWORD}@${DB_HOST:-36.212.172.150}:${DB_PORT:-15432}/aeroequip
      DATABASE_URL_SYNC: postgresql://aeroequip:${DB_PASSWORD}@${DB_HOST:-36.212.172.150}:${DB_PORT:-15432}/aeroequip
      REDIS_URL: redis://${DB_HOST:-36.212.172.150}:16379/0
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      target: dev
    ports:
      - "3000:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
